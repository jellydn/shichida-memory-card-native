name: ShichidaMemoryCards
options:
  bundleIdPrefix: com.dunghd
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  Shichida Memory Cards iOS:
    type: application
    platform: iOS
    sources: ShichidaMemoryCards
    info:
      path: Configuration/iOS-Info.plist
      properties:
        CFBundleDisplayName: Shichida Memory Cards
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - CommitMono.otf
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.dunghd.shichidamemorycards
        PRODUCT_MODULE_NAME: ShichidaMemoryCards
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1,2"
  Shichida Memory Cards macOS:
    type: application
    platform: macOS
    sources: ShichidaMemoryCards
    info:
      path: Configuration/macOS-Info.plist
      properties:
        CFBundleDisplayName: Shichida Memory Cards
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ATSApplicationFontsPath: .
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.dunghd.shichidamemorycards.macos
        PRODUCT_MODULE_NAME: ShichidaMemoryCards
  Shichida Memory Cards Tests:
    type: bundle.unit-test
    platform: macOS
    sources: Tests/ShichidaMemoryCardsTests
    dependencies:
      - target: Shichida Memory Cards macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dunghd.shichidamemorycards.tests
schemes:
  Shichida Memory Cards iOS:
    build:
      targets:
        Shichida Memory Cards iOS: all
  Shichida Memory Cards macOS:
    build:
      targets:
        Shichida Memory Cards macOS: all
        Shichida Memory Cards Tests: [test]
    test:
      targets:
        - Shichida Memory Cards Tests
