name: Apple beta builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apple-beta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and package unsigned apps
    runs-on: macos-26
    outputs:
      artifact_label: ${{ steps.metadata.outputs.artifact_label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve beta metadata
        id: metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            build_label="pr-${PR_NUMBER}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            build_label="manual-${GITHUB_RUN_NUMBER}"
          else
            build_label="main-${GITHUB_RUN_NUMBER}"
          fi

          short_sha="${SOURCE_SHA::7}"
          artifact_label="${build_label}-${short_sha}"
          echo "artifact_label=$artifact_label" >> "$GITHUB_OUTPUT"
          echo "ios_archive=Shichida-Memory-Cards-iOS-Simulator-${artifact_label}.zip" >> "$GITHUB_OUTPUT"
          echo "macos_archive=Shichida-Memory-Cards-macOS-${artifact_label}.zip" >> "$GITHUB_OUTPUT"

      - name: Restore DerivedData cache
        uses: actions/cache@v4
        with:
          path: .build/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ hashFiles('project.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ hashFiles('project.yml') }}-

      - name: Test macOS app
        run: |
          xcodebuild \
            test \
            -project ShichidaMemoryCards.xcodeproj \
            -scheme "Shichida Memory Cards macOS" \
            -destination "platform=macOS" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build Release apps
        run: |
          xcodebuild \
            build \
            -project ShichidaMemoryCards.xcodeproj \
            -scheme "Shichida Memory Cards macOS" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath .build/DerivedData \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          xcodebuild \
            build \
            -project ShichidaMemoryCards.xcodeproj \
            -scheme "Shichida Memory Cards iOS" \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath .build/DerivedData \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Ad-hoc sign and verify macOS app
        run: |
          app_path=".build/DerivedData/Build/Products/Release/Shichida Memory Cards macOS.app"
          test -d "$app_path"
          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Package beta apps
        env:
          IOS_ARCHIVE: ${{ steps.metadata.outputs.ios_archive }}
          MACOS_ARCHIVE: ${{ steps.metadata.outputs.macos_archive }}
        run: |
          mkdir -p .build/artifacts
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            ".build/DerivedData/Build/Products/Release/Shichida Memory Cards macOS.app" \
            ".build/artifacts/$MACOS_ARCHIVE"
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            ".build/DerivedData/Build/Products/Release-iphonesimulator/Shichida Memory Cards iOS.app" \
            ".build/artifacts/$IOS_ARCHIVE"

      - name: Upload macOS beta
        uses: actions/upload-artifact@v7
        with:
          name: shichida-macos-${{ steps.metadata.outputs.artifact_label }}
          path: .build/artifacts/${{ steps.metadata.outputs.macos_archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload iOS Simulator beta
        uses: actions/upload-artifact@v7
        with:
          name: shichida-ios-simulator-${{ steps.metadata.outputs.artifact_label }}
          path: .build/artifacts/${{ steps.metadata.outputs.ios_archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Add verification instructions
        env:
          ARTIFACT_LABEL: ${{ steps.metadata.outputs.artifact_label }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Test Shichida Memory Cards beta ${ARTIFACT_LABEL}

          - **macOS:** Download the macOS artifact, unzip it, then Control-click the app and select **Open**. It has an ad-hoc signature and is not notarized, so Gatekeeper can require **System Settings → Privacy & Security → Open Anyway**.
          - **iOS Simulator:** Download and unzip the simulator artifact, boot a simulator, then run `xcrun simctl install booted "Shichida Memory Cards iOS.app"`.

          Both artifacts expire after 7 days. A device-installable IPA is also produced when the protected beta signing environment is enabled for a trusted branch.
          EOF

  signed-ios:
    name: Build signed iOS IPA
    if: >-
      vars.ENABLE_SIGNED_BETA == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26
    environment: beta
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install signing credentials
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_BETA_PROVISIONING_PROFILE_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/distribution.p12"
          profile_path="$RUNNER_TEMP/beta.mobileprovision"
          keychain_path="$RUNNER_TEMP/beta-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain_path"

          profile_plist="$RUNNER_TEMP/beta-profile.plist"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$profile_plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "profile_name=$profile_name" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"

      - name: Archive signed iOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          xcodebuild \
            archive \
            -project ShichidaMemoryCards.xcodeproj \
            -scheme "Shichida Memory Cards iOS" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ShichidaMemoryCards.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.dunghd.shichidamemorycards</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/ShichidaMemoryCards.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Verify signed IPA
        run: |
          ipa_path="$(find "$RUNNER_TEMP/ipa" -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          unzip -q "$ipa_path" -d "$RUNNER_TEMP/ipa-verification"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/ipa-verification/Payload/"*.app

      - name: Upload signed iOS beta
        uses: actions/upload-artifact@v7
        with:
          name: shichida-ios-device-pr-${{ github.event.pull_request.number || github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing keychain
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        run: |
          if [[ -n "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  comment:
    name: Update PR beta comment
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.build-and-test.result == 'success'
    needs: [build-and-test, signed-ios]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create or update beta comment
        uses: actions/github-script@v9
        env:
          ARTIFACT_LABEL: ${{ needs.build-and-test.outputs.artifact_label }}
          SIGNED_IOS_RESULT: ${{ needs.signed-ios.result }}
        with:
          script: |
            const marker = '<!-- shichida-beta-build -->'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const signedStatus = process.env.SIGNED_IOS_RESULT === 'success'
              ? 'A signed iOS device IPA is also available.'
              : 'The signed iOS device IPA was not produced. See the beta signing setup in the README.'
            const body = `${marker}
            ## Apple beta build

            Beta **${process.env.ARTIFACT_LABEL}** is ready from [this workflow run](${runUrl}).

            - macOS app: ad-hoc signed, not notarized
            - iOS app: Apple Silicon Simulator build
            - ${signedStatus}

            Artifacts expire after 7 days. See the run summary for installation instructions.`
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            )
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
